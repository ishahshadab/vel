<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(135deg, #ffe6f2, #ffb3ba, #ffcccc);
            color: #d63384;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 182, 193, 0.8); }
            to { text-shadow: 0 0 20px rgba(255, 182, 193, 1); }
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-top: 2rem;
        }

        button {
            font-family: 'Great Vibes', cursive;
            font-size: 1.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #yes {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #no {
            background: linear-gradient(45deg, #ffb3ba, #ffcccc);
            color: #d63384;
            position: relative;
        }

        .celebration {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .dancing-emoji {
            position: absolute;
            font-size: 2.5rem;
            animation: dance 2s ease-in-out infinite;
            opacity: 0.9;
        }

        @keyframes dance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-10px) rotate(5deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-10px) rotate(-5deg); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff69b4;
            animation: confettiFall 2s ease-in-out infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }

        audio {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            button {
                font-size: 1.2rem;
                padding: 0.8rem 1.5rem;
            }
            .buttons {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="message">Will you be my Valentine? 💖</h1>
        <div class="buttons">
            <button id="yes">Yes 💘</button>
            <button id="no">No 😶‍🌫️</button>
        </div>
    </div>
    <div class="celebration" id="celebration">
        <h1>YAY!!! You just made me the happiest person ever 😍💞<br>I can’t wait to celebrate Valentine’s Day with you ❤️✨</h1>
        <div class="hearts" id="hearts"></div>
    </div>
    <audio id="cheering" src="https://www.soundjay.com/misc/sounds/applause-01.wav" preload="auto"></audio> <!-- Placeholder for cheering sound; replace with a suitable happy cheering audio file -->

    <script>
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const message = document.getElementById('message');
        const celebration = document.getElementById('celebration');
        const heartsContainer = document.getElementById('hearts');
        const cheering = document.getElementById('cheering');

        // Function to move the No button randomly
        function moveNoButton() {
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            const buttonRect = noButton.getBoundingClientRect();

            let newLeft = Math.random() * (containerRect.width - buttonRect.width);
            let newTop = Math.random() * (containerRect.height - buttonRect.height);

            // Ensure it stays within bounds
            newLeft = Math.max(0, Math.min(newLeft, containerRect.width - buttonRect.width));
            newTop = Math.max(0, Math.min(newTop, containerRect.height - buttonRect.height));

            noButton.style.position = 'absolute';
            noButton.style.left = newLeft + 'px';
            noButton.style.top = newTop + 'px';
            noButton.style.transition = 'all 0.5s ease';
        }

        // Move No button on hover or click
        noButton.addEventListener('mouseenter', moveNoButton);
        noButton.addEventListener('click', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Yes button click event
        yesButton.addEventListener('click', () => {
            // Hide original content
            document.querySelector('.container').style.display = 'none';
            // Show celebration
            celebration.style.display = 'flex';
            // Play cheering sound (may not autoplay due to browser policies; user interaction required)
            cheering.play().catch(() => {}); // Catch in case autoplay is blocked

            // Generate floating hearts
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = '💕';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 3 + 's';
                heartsContainer.appendChild(heart);
            }

            // Generate dancing emojis (dancers, party poppers, etc.)
            const dancingEmojis = ['💃', '🕺', '🎉', '🥳', '😍', '💖', '✨', '🌟'];
            for (let i = 0; i < 15; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'dancing-emoji';
                emoji.textContent = dancingEmojis[Math.floor(Math.random() * dancingEmojis.length)];
                emoji.style.left = Math.random() * 100 + '%';
                emoji.style.top = Math.random() * 100 + '%';
                emoji.style.animationDelay = Math.random() * 2 + 's';
                heartsContainer.appendChild(emoji);
            }

            // Generate confetti
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.background = ['#ff69b4', '#ff1493', '#ffb3ba', '#ffcccc'][Math.floor(Math.random() * 4)];
                heartsContainer.appendChild(confetti);
            }
        });
    </script>
</body>
</html>
